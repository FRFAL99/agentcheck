[project]
name = "agentcheck"
version = "0.1.0"
description = "Check in seconds whether you can trust what Claude Code just did in your repo."
readme = "README.md"
authors = [
    { name = "Francesco Fallavena", email = "francesco.fallavena@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.2",
]

[project.scripts]
agentcheck = "agentcheck.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture files are sample code, some named test_*.py: never collect them.
norecursedirs = ["fixtures", ".*", ".venv", "build", "dist"]
